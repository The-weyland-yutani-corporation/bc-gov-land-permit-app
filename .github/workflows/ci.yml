name: Pull request CI

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/**'
      - 'docs/**'
      - 'infra/**'
      - 'packages/**'
      - 'scripts/**'
      - 'azure.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'apps/**'
      - 'docs/**'
      - 'infra/**'
      - 'packages/**'
      - 'scripts/**'
      - 'azure.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'turbo.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check database migrations
        run: pnpm db:check
      - name: Preflight Foundry evaluations
        run: pnpm --filter @permit-readiness/agent eval:preflight

  infrastructure:
    name: Infrastructure and Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate infrastructure contract
        run: pnpm infra:validate
      - name: Build Bicep and parameter files
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: validation-only-not-a-secret
          ENTRA_EXTERNAL_ID_TENANT_SUBDOMAIN: validation
          ENTRA_EXTERNAL_ID_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ENTRA_EXTERNAL_ID_CLIENT_SECRET: validation-only-not-a-secret
          ENTRA_EXTERNAL_ID_AUTHORITY_HOST: https://validation.ciamlogin.com
          ENTRA_EXTERNAL_ID_REDIRECT_URI: https://example.invalid/auth/callback
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/parameters/dev.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/parameters/prod.bicepparam --stdout > /dev/null

  containers:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            file: apps/web/Dockerfile
          - service: agent
            file: apps/permit-readiness-agent/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: permit-readiness/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  browser-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run:
          pnpm --filter @permit-readiness/web exec playwright install
          --with-deps chromium
      - name: Run browser smoke
        run: pnpm --filter @permit-readiness/web test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
