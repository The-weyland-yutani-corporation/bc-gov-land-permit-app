<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title description">
  <title id="title">Permit Readiness Navigator: local and Azure modes</title>
  <desc id="description">The applicant browser calls only the web server. Within the application boundary, deterministic services own permit reasoning and access scoped repositories. Local mode uses demo identity, memory storage, coordinate input, and a deterministic navigator. Configured Azure mode uses External ID, PostgreSQL and PostGIS, Maps, and a bounded Foundry agent with curated Search. These cloud dependencies are not verified by local execution. The outcome is a non-binding report and preparation tasks, not an application or approval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#234075"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #313132; font-size: 18px; }
      .heading { font-size: 26px; font-weight: bold; }
      .label { font-weight: bold; }
      .box { fill: #fff; stroke: #234075; stroke-width: 2; }
      .boundary { fill: #edf3f8; stroke: #234075; stroke-width: 2; }
      .line { fill: none; stroke: #234075; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="760" fill="#fff"/>
  <text x="30" y="40" class="heading">Permit Readiness Navigator</text>
  <text x="30" y="72">Demonstration — not an official government service</text>
  <rect x="30" y="96" width="1040" height="6" fill="#e3a82b"/>
  <rect x="395" y="120" width="310" height="60" class="box"/>
  <text x="430" y="157" class="label">Applicant browser</text>
  <path d="M550 180 V225" class="line"/>
  <rect x="260" y="225" width="580" height="205" class="boundary"/>
  <text x="285" y="255" class="label">Application trust boundary</text>
  <text x="285" y="290">Next.js server: authentication and ownership</text>
  <text x="285" y="325">Deterministic services: rules, gaps, sequence</text>
  <text x="285" y="360">Scoped repositories and versioned configuration</text>
  <text x="285" y="400">Browser never calls Foundry or the database</text>
  <path d="M370 430 V465 H285 V490" class="line"/>
  <path d="M730 430 V465 H815 V490" class="line"/>
  <rect x="30" y="490" width="505" height="160" class="box"/>
  <text x="50" y="520" class="label">Local mode: no cloud credentials</text>
  <text x="50" y="555">Demo identity • process-memory repository</text>
  <text x="50" y="590">Coordinate/GeoJSON location fallback</text>
  <text x="50" y="625">Deterministic local navigator; illustrative sources</text>
  <rect x="565" y="490" width="505" height="160" class="box"/>
  <text x="585" y="520" class="label">Azure mode: requires approved configuration</text>
  <text x="585" y="555">External ID • PostgreSQL/PostGIS • Maps</text>
  <text x="585" y="590">Bounded Foundry agent → curated Search</text>
  <text x="585" y="625">Typed tools call scoped server operations</text>
  <text x="30" y="695" class="label">Outcome: non-binding readiness report → preparation tasks → confirm with authority</text>
  <text x="30" y="730">Simplified architecture, not deployment evidence. Full trust boundaries: ARCHITECTURE.md.</text>
</svg>
